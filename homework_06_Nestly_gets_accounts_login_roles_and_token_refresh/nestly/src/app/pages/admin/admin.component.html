<section class="admin-page">
  <h1>Admin</h1>

  <p>
    Manage Nestly stays.
  </p>

  @if (error()) {
    <p>
      {{ error() }}
    </p>
  }

  <table mat-table [dataSource]="stays()">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>
        ID
      </th>

      <td mat-cell *matCellDef="let stay">
        {{ stay.id }}
      </td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>
        Title
      </th>

      <td mat-cell *matCellDef="let stay">
        {{ stay.title }}
      </td>
    </ng-container>

    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef>
        Location
      </th>

      <td mat-cell *matCellDef="let stay">
        {{ stay.location }}
      </td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>
        Price
      </th>

      <td mat-cell *matCellDef="let stay">
        €{{ stay.pricePerNight }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        Actions
      </th>

      <td mat-cell *matCellDef="let stay">

        <button
          mat-raised-button
          color="warn"
          (click)="deleteStay(stay.id)"
        >
          Delete
        </button>

      </td>
    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns"
    ></tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
    ></tr>
  </table>
</section>
