<a class="stay-card-link" [routerLink]="['/stays', stay().id]">
  <app-card-shell appHighlightCard>
    <div class="stay-image-wrapper">

      <img class="stay-image" [src]="stay().image" [alt]="stay().title" />

      @if (stay().superhost) {
      <div class="superhost-badge">
        <app-badge>
          Superhost
        </app-badge>
      </div>
      }

      <button mat-icon-button class="favorite-button" type="button"
        (click)="toggleFavorite(); $event.preventDefault(); $event.stopPropagation()" [attr.aria-label]="
          favorite()
            ? 'Remove from favorites'
            : 'Add to favorites'
        ">
        <mat-icon>
          {{
          favorite()
          ? 'favorite'
          : 'favorite_border'
          }}
        </mat-icon>
      </button>

    </div>

    <div class="stay-content">
      <div class="stay-header">
        <div>
          <h2>
            {{ stay().title }}
          </h2>

          <p class="stay-location">
            <mat-icon>location_on</mat-icon>
            {{ stay().location }}
          </p>
        </div>
      </div>

      <div class="stay-rating">
        <mat-icon>star</mat-icon>

        <span>
          {{ stay().rating }}
        </span>
      </div>

      <p class="stay-description">
        {{ stay().description | truncate: 80 }}
      </p>

      <div class="stay-footer">
        <div class="stay-price">

          <strong>
            {{ stay().pricePerNight | currency:'EUR':'symbol':'1.0-0' }}
          </strong>

          <span>
            / night
          </span>
        </div>

      </div>
    </div>

  </app-card-shell>
</a>
